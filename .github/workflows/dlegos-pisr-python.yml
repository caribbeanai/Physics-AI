name: D-LEGOS-PISR Python

on:
  pull_request:
    paths:
      - 'dlegos-pisr-caribbean/**'
      - '.github/workflows/dlegos-pisr-python.yml'
  push:
    branches: [main]
    paths:
      - 'dlegos-pisr-caribbean/**'
      - '.github/workflows/dlegos-pisr-python.yml'

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: dlegos-pisr-caribbean
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'build>=1.2' 'pytest>=8,<10'
      - name: Build and install the wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps dist/*.whl
      - name: Test the installed package
        env:
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_library.py
