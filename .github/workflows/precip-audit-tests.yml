name: Precipitation audit tests

on:
  pull_request:
    paths:
      - '.github/workflows/precip-audit-tests.yml'
      - 'dlegos-pisr-caribbean/scripts/evaluate_precipcorrdiff.py'
      - 'dlegos-pisr-caribbean/tests/test_precipcorrdiff.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/precip-audit-tests.yml'
      - 'dlegos-pisr-caribbean/scripts/evaluate_precipcorrdiff.py'
      - 'dlegos-pisr-caribbean/tests/test_precipcorrdiff.py'

permissions:
  contents: read

jobs:
  synthetic-netcdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluator and test dependencies
        run: python -m pip install 'xarray>=2025.10' scipy cftime pytest
      - name: Run synthetic NetCDF audit tests
        working-directory: dlegos-pisr-caribbean
        run: python -m pytest -q tests/test_precipcorrdiff.py
