experiments:
  primary_1deg_to_025:
    input_resolution_deg: 1.0
    target_resolution_deg: 0.25
    period: [2017, 2018]
    models: [bilinear, edsr, pisr, dlegos_pisr]
  scale_05deg_to_025:
    input_resolution_deg: 0.5
    target_resolution_deg: 0.25
    period: [2017, 2018]
    models: [bilinear, edsr, pisr, dlegos_pisr]
  scale_2deg_to_025:
    input_resolution_deg: 2.0
    target_resolution_deg: 0.25
    period: [2017, 2018]
    models: [bilinear, edsr, pisr, dlegos_pisr]
  temporal_holdout:
    input_resolution_deg: 1.0
    target_resolution_deg: 0.25
    period: [2019, 2025]
    models: [bilinear, edsr, pisr, dlegos_pisr]
  ablations:
    period: [2017, 2018]
    models: [dlegos_no_physics, dlegos_local_physics, dlegos_interface_only, dlegos_full]
  extremes:
    period: [2017, 2025]
    analyses: [heat, wind, tropical_cyclone]
validation:
  paired_bootstrap_samples: 5000
  confidence_level: 0.95
  wilcoxon: true
  multiple_testing_correction: holm
  preserve_negative_results: true
  deliberate_wrong_input_test: true
